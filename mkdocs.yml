site_name: LESGO GPU Porting Guide
site_description: Build, validation, and maintenance notes for the LESGO GPU port.
site_author: Wenyuan Chen
repo_url: https://github.com/wychen97/lesgo-gpu-porting
repo_name: wychen97/lesgo-gpu-porting

docs_dir: docs

extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md
  - GPU Porting Guide:
      - Overview: gpu/index.md
      - Current Release: gpu/explicit-residency.md
      - Public Test Cases: gpu/test-cases.md
      - Main Timestep Flow: gpu/main-flow.md
      - GPU Architecture: gpu/architecture.md
      - Build and Runtime: gpu/build-runtime.md
      - CMake and Environment: gpu/cmake-environment.md
      - Validation and Performance: gpu/validation-performance.md
      - Source Inventory: gpu/file-audit.md
      - Developer Guide: gpu/developer-guide.md
  - Module Notes:
      - Derivatives, Convection, Projection: gpu/modules/core-solver.md
      - SGS and Stresses: gpu/modules/sgs.md
      - Pressure Solver: gpu/modules/pressure.md
      - ATM and Forcing: gpu/modules/atm-forcing.md
      - Optional Modules: gpu/modules/optional-modules.md

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - toc.follow
    - content.code.copy
    - search.suggest
  palette:
    - scheme: default
      primary: blue
      accent: light blue

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.snippets
