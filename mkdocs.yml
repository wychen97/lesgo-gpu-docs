site_name: LESGO GPU Migration Guide
site_description: Public engineering handoff documentation for the LESGO GPU migration.
site_author: Wenyuan Chen
repo_url: https://github.com/wychen97/lesgo-gpu-docs
repo_name: wychen97/lesgo-gpu-docs

docs_dir: docs

extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md
  - GPU Migration Guide:
      - Overview: gpu/index.md
      - Main Timestep Flow: gpu/main-flow.md
      - GPU Architecture: gpu/architecture.md
      - Build And Runtime: gpu/build-runtime.md
      - CMake And Environment: gpu/cmake-environment.md
      - Validation And Performance: gpu/validation-performance.md
      - File Audit: gpu/file-audit.md
  - Module Notes:
      - Derivatives, Convection, Projection: gpu/modules/core-solver.md
      - SGS And Stresses: gpu/modules/sgs.md
      - Pressure Solver: gpu/modules/pressure.md
      - ATM And Forcing: gpu/modules/atm-forcing.md
      - Optional Modules: gpu/modules/optional-modules.md

theme:
  name: material
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - toc.follow
    - content.code.copy
  palette:
    - scheme: default
      primary: indigo
      accent: blue

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.snippets
