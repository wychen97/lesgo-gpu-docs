<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 420" role="img" aria-labelledby="title desc">
<title id="title">CPU sweep line chart</title>
<desc id="desc">CPU step time as MPI rank count increases for the 480 by 240 by 240 case.</desc>
<style>.title{font:800 24px system-ui,sans-serif;fill:#172033}.sub{font:500 14px system-ui,sans-serif;fill:#64748b}.axis{font:600 12px system-ui,sans-serif;fill:#64748b}.label{font:700 13px system-ui,sans-serif;fill:#172033}</style>
<rect fill="#fff" width="820" height="420" rx="16"/>
<text x="70" y="30" class="title">CPU sweep, 480x240x240</text>
<text x="70" y="54" class="sub">Line chart of measured no-I/O CPU step time versus MPI rank count.</text>
<line x1="82" y1="352.0" x2="778" y2="352.0" stroke="#e5edf7"/>
<text x="70" y="356.0" text-anchor="end" class="axis">0.0</text>
<line x1="82" y1="291.1" x2="778" y2="291.1" stroke="#e5edf7"/>
<text x="70" y="295.1" text-anchor="end" class="axis">0.5</text>
<line x1="82" y1="230.3" x2="778" y2="230.3" stroke="#e5edf7"/>
<text x="70" y="234.3" text-anchor="end" class="axis">1.0</text>
<line x1="82" y1="169.4" x2="778" y2="169.4" stroke="#e5edf7"/>
<text x="70" y="173.4" text-anchor="end" class="axis">1.5</text>
<line x1="82" y1="108.5" x2="778" y2="108.5" stroke="#e5edf7"/>
<text x="70" y="112.5" text-anchor="end" class="axis">2.0</text>
<line x1="82.0" y1="72" x2="82.0" y2="352" stroke="#f1f5f9"/>
<text x="82.0" y="384" text-anchor="middle" class="axis">24</text>
<line x1="198.0" y1="72" x2="198.0" y2="352" stroke="#f1f5f9"/>
<text x="198.0" y="384" text-anchor="middle" class="axis">40</text>
<line x1="343.0" y1="72" x2="343.0" y2="352" stroke="#f1f5f9"/>
<text x="343.0" y="384" text-anchor="middle" class="axis">60</text>
<line x1="488.0" y1="72" x2="488.0" y2="352" stroke="#f1f5f9"/>
<text x="488.0" y="384" text-anchor="middle" class="axis">80</text>
<line x1="778.0" y1="72" x2="778.0" y2="352" stroke="#f1f5f9"/>
<text x="778.0" y="384" text-anchor="middle" class="axis">120</text>
<polygon points="82.0,94.3 198.0,182.4 343.0,228.4 488.0,248.9 778.0,274.8 778.0,352.0 82.0,352.0" fill="#dbeafe" opacity="0.45"/>
<polyline points="82.0,94.3 198.0,182.4 343.0,228.4 488.0,248.9 778.0,274.8" fill="none" stroke="#2563eb" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="82.0" cy="94.3" r="6" fill="#2563eb" stroke="#fff" stroke-width="2"/>
<text x="82.0" y="82.3" text-anchor="middle" class="label">2.12s</text>
<circle cx="198.0" cy="182.4" r="6" fill="#2563eb" stroke="#fff" stroke-width="2"/>
<text x="198.0" y="170.4" text-anchor="middle" class="label">1.39s</text>
<circle cx="343.0" cy="228.4" r="6" fill="#2563eb" stroke="#fff" stroke-width="2"/>
<text x="343.0" y="216.4" text-anchor="middle" class="label">1.02s</text>
<circle cx="488.0" cy="248.9" r="6" fill="#2563eb" stroke="#fff" stroke-width="2"/>
<text x="488.0" y="236.9" text-anchor="middle" class="label">0.85s</text>
<circle cx="778.0" cy="274.8" r="6" fill="#d97706" stroke="#fff" stroke-width="2"/>
<text x="778.0" y="262.8" text-anchor="middle" class="label">0.63s</text>
<text x="430.0" y="410" text-anchor="middle" class="axis">CPU MPI ranks</text>
<text x="22" y="212.0" text-anchor="middle" transform="rotate(-90 22 212.0)" class="axis">seconds / step</text>
</svg>
