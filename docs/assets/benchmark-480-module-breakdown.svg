<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" role="img" aria-labelledby="title desc">
<title id="title">Module timing breakdown</title>
<desc id="desc">CPU and GPU module timing comparison for the 480 grid.</desc>
<style>.title{font:800 24px system-ui,sans-serif;fill:#172033}.sub{font:500 14px system-ui,sans-serif;fill:#64748b}.axis{font:600 12px system-ui,sans-serif;fill:#64748b}.label{font:700 13px system-ui,sans-serif;fill:#172033}</style>
<rect fill="#fff" width="1000" height="470" rx="16"/>
<text x="190" y="30" class="title">Module timing, 480x240x240</text>
<text x="190" y="52" class="sub">CPU uses 120 MPI ranks; GPU values average steps 2-10.</text>
<line x1="190.0" y1="68" x2="190.0" y2="416" stroke="#e5edf7"/>
<text x="190.0" y="442" text-anchor="middle" class="axis">0.00</text>
<line x1="371.5" y1="68" x2="371.5" y2="416" stroke="#e5edf7"/>
<text x="371.5" y="442" text-anchor="middle" class="axis">0.05</text>
<line x1="552.9" y1="68" x2="552.9" y2="416" stroke="#e5edf7"/>
<text x="552.9" y="442" text-anchor="middle" class="axis">0.10</text>
<line x1="734.4" y1="68" x2="734.4" y2="416" stroke="#e5edf7"/>
<text x="734.4" y="442" text-anchor="middle" class="axis">0.15</text>
<line x1="915.9" y1="68" x2="915.9" y2="416" stroke="#e5edf7"/>
<text x="915.9" y="442" text-anchor="middle" class="axis">0.20</text>
<text x="178" y="96.0" text-anchor="end" class="label">Derivatives</text>
<rect x="190" y="76.0" width="245.0" height="13" rx="4" fill="#d97706"/>
<text x="442.0" y="86.0" class="axis">67.5 ms</text>
<rect x="190" y="94.0" width="64.2" height="13" rx="4" fill="#2563eb"/>
<text x="261.2" y="104.0" class="axis">17.7 ms</text>
<rect x="190" y="112.0" width="33.0" height="13" rx="4" fill="#059669"/>
<text x="230.0" y="122.0" class="axis">9.1 ms</text>
<text x="178" y="154.0" text-anchor="end" class="label">SGS &amp; Stresses</text>
<rect x="190" y="134.0" width="528.4" height="13" rx="4" fill="#d97706"/>
<text x="725.4" y="144.0" class="axis">145.6 ms</text>
<rect x="190" y="152.0" width="82.0" height="13" rx="4" fill="#2563eb"/>
<text x="279.0" y="162.0" class="axis">22.6 ms</text>
<rect x="190" y="170.0" width="48.3" height="13" rx="4" fill="#059669"/>
<text x="245.3" y="180.0" class="axis">13.3 ms</text>
<text x="178" y="212.0" text-anchor="end" class="label">Convection</text>
<rect x="190" y="192.0" width="671.4" height="13" rx="4" fill="#d97706"/>
<text x="868.4" y="202.0" class="axis">185.0 ms</text>
<rect x="190" y="210.0" width="90.0" height="13" rx="4" fill="#2563eb"/>
<text x="287.0" y="220.0" class="axis">24.8 ms</text>
<rect x="190" y="228.0" width="53.7" height="13" rx="4" fill="#059669"/>
<text x="250.7" y="238.0" class="axis">14.8 ms</text>
<text x="178" y="270.0" text-anchor="end" class="label">Pressure Solver</text>
<rect x="190" y="250.0" width="286.7" height="13" rx="4" fill="#d97706"/>
<text x="483.7" y="260.0" class="axis">79.0 ms</text>
<rect x="190" y="268.0" width="39.2" height="13" rx="4" fill="#2563eb"/>
<text x="236.2" y="278.0" class="axis">10.8 ms</text>
<rect x="190" y="286.0" width="52.6" height="13" rx="4" fill="#059669"/>
<text x="249.6" y="296.0" class="axis">14.5 ms</text>
<text x="178" y="328.0" text-anchor="end" class="label">Projection</text>
<rect x="190" y="308.0" width="102.7" height="13" rx="4" fill="#d97706"/>
<text x="299.7" y="318.0" class="axis">28.3 ms</text>
<rect x="190" y="326.0" width="6.5" height="13" rx="4" fill="#2563eb"/>
<text x="203.5" y="336.0" class="axis">1.8 ms</text>
<rect x="190" y="344.0" width="13.8" height="13" rx="4" fill="#059669"/>
<text x="210.8" y="354.0" class="axis">3.8 ms</text>
<text x="178" y="386.0" text-anchor="end" class="label">Forcing</text>
<rect x="190" y="366.0" width="15.2" height="13" rx="4" fill="#d97706"/>
<text x="212.2" y="376.0" class="axis">4.2 ms</text>
<rect x="190" y="384.0" width="4.7" height="13" rx="4" fill="#2563eb"/>
<text x="201.7" y="394.0" class="axis">1.3 ms</text>
<rect x="190" y="402.0" width="5.8" height="13" rx="4" fill="#059669"/>
<text x="202.8" y="412.0" class="axis">1.6 ms</text>
<text x="566.0" y="464" text-anchor="middle" class="axis">seconds / step</text>
<rect x="700" y="24" width="13" height="13" rx="3" fill="#d97706"/>
<text x="720" y="35" class="axis">CPU 120 MPI</text>
<rect x="700" y="44" width="13" height="13" rx="3" fill="#2563eb"/>
<text x="720" y="55" class="axis">1 GPU</text>
<rect x="700" y="64" width="13" height="13" rx="3" fill="#059669"/>
<text x="720" y="75" class="axis">2 GPUs</text>
</svg>
