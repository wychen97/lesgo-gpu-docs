<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" role="img" aria-labelledby="title desc">
<title id="title">GPU configuration scaling</title>
<desc id="desc">Measured A100 GPU step times for one through four GPUs on the 480 by 240 by 240 case.</desc>
<style>.title{font:800 24px system-ui,sans-serif;fill:#172033}.sub{font:500 14px system-ui,sans-serif;fill:#64748b}.axis{font:600 12px system-ui,sans-serif;fill:#64748b}.label{font:700 13px system-ui,sans-serif;fill:#172033}.note{font:650 12px system-ui,sans-serif;fill:#64748b}.warn{font:750 12px system-ui,sans-serif;fill:#b45309}</style>
<rect fill="#fff" width="900" height="460" rx="16"/>
<text x="70" y="30" class="title">GPU configurations, 480x240x240</text>
<text x="70" y="54" class="sub">Measured same-node A100 runs. The 2-GPU point is fastest because it uses the specialized 2-rank pressure path.</text>
<line x1="86" y1="378.0" x2="836" y2="378.0" stroke="#e5edf7"/>
<text x="74" y="382.0" text-anchor="end" class="axis">0.00</text>
<line x1="86" y1="303.0" x2="836" y2="303.0" stroke="#e5edf7"/>
<text x="74" y="307.0" text-anchor="end" class="axis">0.03</text>
<line x1="86" y1="228.0" x2="836" y2="228.0" stroke="#e5edf7"/>
<text x="74" y="232.0" text-anchor="end" class="axis">0.06</text>
<line x1="86" y1="153.0" x2="836" y2="153.0" stroke="#e5edf7"/>
<text x="74" y="157.0" text-anchor="end" class="axis">0.09</text>
<line x1="86" y1="78.0" x2="836" y2="78.0" stroke="#e5edf7"/>
<text x="74" y="82.0" text-anchor="end" class="axis">0.12</text>
<line x1="86.0" y1="78" x2="86.0" y2="378" stroke="#f1f5f9"/>
<text x="86.0" y="415" text-anchor="middle" class="axis">1</text>
<line x1="336.0" y1="78" x2="336.0" y2="378" stroke="#f1f5f9"/>
<text x="336.0" y="415" text-anchor="middle" class="axis">2</text>
<line x1="586.0" y1="78" x2="586.0" y2="378" stroke="#f1f5f9"/>
<text x="586.0" y="415" text-anchor="middle" class="axis">3</text>
<line x1="836.0" y1="78" x2="836.0" y2="378" stroke="#f1f5f9"/>
<text x="836.0" y="415" text-anchor="middle" class="axis">4</text>
<polyline points="86.0,119.6 336.0,225.5 586.0,122.4 836.0,128.5" fill="none" stroke="#0f766e" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="86.0" cy="119.6" r="7" fill="#2563eb" stroke="#fff" stroke-width="2"/>
<text x="86.0" y="105.6" text-anchor="middle" class="label">0.103s</text>
<circle cx="336.0" cy="225.5" r="7" fill="#059669" stroke="#fff" stroke-width="2"/>
<text x="336.0" y="211.5" text-anchor="middle" class="label">0.061s</text>
<circle cx="586.0" cy="122.4" r="7" fill="#2563eb" stroke="#fff" stroke-width="2"/>
<text x="586.0" y="108.4" text-anchor="middle" class="label">0.102s</text>
<text x="586.0" y="147.4" text-anchor="middle" class="warn">generic pressure</text>
<circle cx="836.0" cy="128.5" r="7" fill="#2563eb" stroke="#fff" stroke-width="2"/>
<text x="836.0" y="114.5" text-anchor="middle" class="label">0.100s</text>
<text x="836.0" y="153.5" text-anchor="middle" class="warn">generic pressure</text>
<text x="461.0" y="445" text-anchor="middle" class="axis">A100 GPUs / MPI ranks</text>
<text x="23" y="228.0" text-anchor="middle" transform="rotate(-90 23 228.0)" class="axis">seconds / step</text>
</svg>
